$font = SpaceMono

general {
    	hide_cursor = false
}

animations {
    	enabled = true
}

background {
    	path = ~/.config/hypr/wallpaper/skyebg.png
}

input-field {
    	size = 20%, 5%
    	outline_thickness = 1
    	inner_color = rgba(0, 0, 0, 1)

    	outer_color = rgb(e0e0e0)
    	check_color = rgba(e0e0e0)
    	fail_color = rgba(e0e0e0)

    	font_color = rgb(e0e0e0)
    	fade_on_empty = false
    	rounding = 3

    	font_family = $font
    	placeholder_text = input password
    	fail_text = incorrect password

    	dots_text_format = ●
    	dots_size = 0.2
    	dots_spacing = 0.4

    	position = 100, -55
    	halign = left
    	valign = center
}

# TIME
label {
    	text = $TIME 
    	font_size = 40
    	color = rgb(e0e0e0)
    	font_family = $font

    	position = 100, 65
    	halign = left
    	valign = center
}

# DATE
label {
    	text = cmd[update:60000] date +"%A, %d. %B" # update every 60 seconds
    	font_size = 25
    	color = rgb(e0e0e0)
    	font_family = $font

    	position = 100, 15
    	halign = left
	valign = center
}
